[build-system]
requires = ["setuptools>=61", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "python-hiddenmarkov"
version = "0.2.0"
description = "A simple Python package for Hidden Markov Models"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Carlos Cancino-Chacón", email = "carloscancinochacon@gmail.com" },
    { name = "Silvan Peter" },
]
keywords = ["hmm", "hidden_markov_models"]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.7",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Homepage = "https://github.com/CarlosCancino-Chacon/hiddenmarkov"

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.setuptools.package-data]
hiddenmarkov = ["py.typed", "_hmm.pyi"]

[tool.coverage.run]
source = ["hiddenmarkov"]
omit = ["hiddenmarkov/score_hmm.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]
