name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test · Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: pip install numpy>=1.24 cython setuptools

      - name: Build extension in-place
        run: python setup.py build_ext --inplace

      - name: Install package and test dependencies
        run: pip install -e . pytest pytest-cov scipy

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --ignore=tests/dev_transition_model_array.py \
            --cov=hiddenmarkov \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Verify the sdist installs and its tests pass
  # ---------------------------------------------------------------------------
  sdist:
    name: sdist smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist

      - name: Install from sdist
        run: pip install dist/*.tar.gz

      - name: Smoke-test installed package
        run: |
          cd /tmp
          python -c "from hiddenmarkov import HMM, ConstantTransitionModel, CategoricalObservationModel, viterbi_algorithm; import numpy as np; om = CategoricalObservationModel(np.array([[0.5,0.1],[0.4,0.3],[0.1,0.6]]), ('normal','cold','dizzy')); tm = ConstantTransitionModel(np.array([[0.7,0.3],[0.4,0.6]]), np.array([0.6,0.4])); hmm = HMM(om, tm, state_space=('Healthy','Fever')); path, prob = viterbi_algorithm(hmm, ('normal','cold','dizzy'), log_probabilities=False); assert list(path) == ['Healthy','Healthy','Fever']; assert abs(prob-0.01512) < 1e-5; print('OK')"
